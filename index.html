<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <title>ECAMS Billboard</title>
    <!--CSS Stylesheets-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://site-assets.fontawesome.com/releases/v6.2.1/css/all.css" />
    <link rel="stylesheet" href="assets/styles.css" />
</head>
<!--Body of HTML-->

<body>
    <div class="container text-dark">
        <div class="row mt-3">
            <div class="col-8 text-center">
                <div class="row">
                    <div class="col">
                        <h1>Find My Professor</h1>
                        <p>Engineering, Computing and Mathematical Sciences</p>
                    </div>
                </div>
                <div class="row">
                    <div class="col">
                        <!--Carousel For images-->
                        <div id="carouselExampleCaptions" class="carousel slide" data-bs-ride="carousel">
                            <div class="carousel-inner">
                                <div class="carousel-item active" data-bs-interval="5000">
                                    <img src="assets/galaxyone.jpeg" class="d-block w-100" alt="Galaxy One" width="375"
                                        height="500" />
                                    <div class="carousel-caption d-none d-md-block">
                                        <h5>Galaxy One</h5>
                                        <p>Pretty Cool.</p>
                                    </div>
                                </div>
                                <div class="carousel-item" data-bs-interval="5000">
                                    <img src="assets/galaxytwo.jpg" class="d-block w-100" alt="Galaxy Two" width="375"
                                        height="500" />
                                    <div class="carousel-caption d-none d-md-block">
                                        <h5>Galaxy Two</h5>
                                        <p>Wow.</p>
                                    </div>
                                </div>
                                <div class="carousel-item" data-bs-interval="5000">
                                    <img src="assets/galaxythree.jpeg" class="d-block w-100" alt="Galaxy Three"
                                        width="375" height="500" />
                                    <div class="carousel-caption d-none d-md-block">
                                        <h5>Galaxy Three</h5>
                                        <p>Take me to space.</p>
                                    </div>
                                </div>
                            </div>
                            <button class="carousel-control-prev" type="button"
                                data-bs-target="#carouselExampleCaptions" data-bs-slide="prev">
                                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                                <span class="visually-hidden">Previous</span>
                            </button>
                            <button class="carousel-control-next" type="button"
                                data-bs-target="#carouselExampleCaptions" data-bs-slide="next">
                                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                                <span class="visually-hidden">Next</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-4 text-center">

            </div>
        </div>


    </div>


    <!--Sourse for Javascript files for bootstrap and individual code as well-->
    <script src="https://code.jquery.com/jquery-3.3.1.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.3/dist/umd/popper.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
    <script src="assets/scripts.js"></script>
</body>

</html>
