<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <title>ECAMS Billboard</title>
    <!--CSS Stylesheets-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://site-assets.fontawesome.com/releases/v6.2.1/css/all.css" />
    <link rel="stylesheet" href="assets/styles.css" />
</head>

<body>
    <div class="container">
        <div class="row mt-3">
            <div class="col text-center">
                <h1>ECAMS Billboard</h1>
                <p>Engineering, Computing and Mathematical Sciences</p>
                <p>Faculty Offices</p>
            </div>
        </div>
        <table class="table table-light table-hover">
            <thead>
              <tr>
                <th scope="col">Faculty</th>
                <th scope="col">Office Room Number</th>
              </tr>
            </thead>
            <tbody id="profs"></tbody>
          </table>
    </div>

    <!--Sourse for Javascript files for bootstrap and individual code as well-->
    <script src="https://code.jquery.com/jquery-3.3.1.min.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.3/dist/umd/popper.min.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
    <script src="assets/scripts.js"></script>
</body>

</html>
