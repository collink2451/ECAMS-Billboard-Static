<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />

    <title>ECAMS Billboard</title>
    <!--CSS Stylesheets-->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://site-assets.fontawesome.com/releases/v6.2.1/css/all.css"
    />
    <link rel="stylesheet" href="assets/styles.css" />
    <link rel="icon" href="assets/ecams-logo.JPG">
  </head>

  <body>
    <div id="banner">
      <table>
          <tr>
              <th id="logo-box">
                <img id="logo" src="assets/ecams-logo.JPG" alt="the ecams logo">
              </th>
          </tr>
      </table>
  </div>
<br>
<br>
    <div class="container">
      <div class="row mt-3">
        <img id="background-image" src="assets/red-science-center.png" alt="picture of science center">
        <div class="col text-center">
          <div id="absolute-text">
            <h3>ECAMS Billboard</h3>
            <p>Engineering, Computing and Mathematical Sciences</p>
            <p>Faculty Offices</p>
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-3"></div>
        <div class="col-6">
          <table class="table table-sm table-light table-hover">
            <thead>
              <tr class="table">
                <th scope="col">Faculty</th>
                <th scope="col">Office Room Number</th>
              </tr>
            </thead>
            <tbody id="profs"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!--Sourse for Javascript files for bootstrap and individual code as well-->
    <script
      src="https://code.jquery.com/jquery-3.3.1.min.js"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/popper.js@1.14.3/dist/umd/popper.min.js"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"
      crossorigin="anonymous"
    ></script>
    <script src="assets/scripts.js"></script>
  </body>
</html>
